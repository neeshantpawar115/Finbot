<!DOCTYPE html>
<!-- FinBot, Stage 1 of 8 (website foundation and UI): this single file holds the layout, theme, navigation and placeholder pages that later stages will connect to real features. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FinBot — Personal Finance & Market Intelligence</title>
<style>
/* DESIGN TOKENS: one place that defines the brand colours for light and dark themes so every component stays consistent. */
:root{--g:#10B981;--gd:#047857;--tx:#17211D;--tx2:#647067;--bg:#F7F9F7;--card:#fff;--bd:#E4EAE5;--soft:#ECFDF5;--red:#DC2626;--sb:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root:not([data-theme="light"]){}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--tx:#E7EEE9;--tx2:#93A097;--bg:#111714;--card:#18201C;--bd:#26302A;--soft:#12261D;--sb:#141B17;--gd:#34D399}}
:root[data-theme="dark"]{--tx:#E7EEE9;--tx2:#93A097;--bg:#111714;--card:#18201C;--bd:#26302A;--soft:#12261D;--sb:#141B17;--gd:#34D399}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
/* SIDEBAR: styles the collapsible left panel with branding, New Chat, history and navigation. */
#sb{width:268px;background:var(--sb);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:14px 12px;transition:width .2s;flex:none;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px;font-weight:700;font-size:18px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--g);color:#fff;display:grid;place-items:center;flex:none}
.logo svg{stroke:#fff}
.ib{background:none;border:0;color:var(--tx2);padding:6px;border-radius:8px;display:grid;place-items:center}
.ib:hover{background:var(--soft);color:var(--gd)}
.brand .ib{margin-left:auto}
.newchat{display:flex;align-items:center;gap:10px;background:var(--g);color:#fff;border:0;border-radius:10px;padding:10px 12px;font-weight:600;margin-bottom:12px}
.newchat:hover{background:var(--gd)}
.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2);padding:8px 8px 4px}
#hist{max-height:120px;overflow:auto;margin-bottom:6px}
.hi{display:flex;align-items:center;gap:6px;width:100%;text-align:left;background:none;border:0;padding:6px 8px;border-radius:8px;color:var(--tx2);font-size:13px}
.hi:hover{background:var(--soft)}.hi span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hi i{opacity:0;font-style:normal;padding:0 4px}.hi:hover i{opacity:1;color:var(--red)}
.empty-s{font-size:13px;color:var(--tx2);padding:4px 8px}
nav{display:flex;flex-direction:column;gap:2px;overflow:auto}
.nv{display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:10px;padding:9px 10px;color:var(--tx2);text-align:left;white-space:nowrap;position:relative}
.nv:hover{background:var(--soft);color:var(--tx)}
.nv.on{background:var(--soft);color:var(--gd);font-weight:600}
.nv.on:before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--g)}
body.col #sb{width:68px}
body.col .tx,body.col .lbl,body.col #hist,body.col .brand b{display:none}
body.col .brand{justify-content:center;flex-wrap:wrap}body.col .brand .ib{margin:0}
body.col .nv,body.col .newchat{justify-content:center;padding:10px}
[data-tip]{position:relative}
body.col [data-tip]:hover:after{content:attr(data-tip);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);background:var(--tx);color:var(--bg);padding:4px 8px;border-radius:6px;font-size:12px;white-space:nowrap;z-index:60;font-weight:500}
/* MAIN WORKSPACE: styles the top bar, the page area, headings, cards, buttons, chips and empty states shared by every page. */
#main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;gap:10px;padding:12px 24px;border-bottom:1px solid var(--bd)}
.top h2{margin:0;font-size:16px;font-weight:600;flex:1}
#menu{display:none}
#view{flex:1;overflow:auto;padding:32px 24px 40px}
.wrap{max-width:960px;margin:0 auto}
h1{font-size:clamp(28px,4vw,40px);line-height:1.15;letter-spacing:-.02em;margin:0 0 10px}
.sub{color:var(--tx2);font-size:17px;margin:0 0 28px;max-width:620px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:28px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px}
.hc{text-align:left;transition:border-color .15s,transform .15s;display:flex;flex-direction:column;gap:8px}
.hc:hover{border-color:var(--g);transform:translateY(-2px)}
.ico{width:38px;height:38px;border-radius:10px;background:var(--soft);color:var(--gd);display:grid;place-items:center}
.hc b{font-size:16px}.hc p{margin:0;color:var(--tx2);font-size:13.5px}
.chatbox{display:flex;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:8px 8px 8px 16px;align-items:center}
.chatbox:focus-within{border-color:var(--g);box-shadow:0 0 0 3px rgba(16,185,129,.15)}
.chatbox input{flex:1;border:0;background:none;outline:0;min-width:0;padding:8px 0}
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--gd)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sec{background:none;color:var(--tx);border:1px solid var(--bd)}.btn.sec:hover{border-color:var(--g);color:var(--gd)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--tx2)}
.chip:hover{border-color:var(--g);color:var(--gd)}
.empty{border:1px dashed var(--bd);border-radius:14px;padding:36px 20px;text-align:center;color:var(--tx2)}
.empty .ico{margin:0 auto 12px}.empty b{display:block;color:var(--tx);font-size:16px;margin-bottom:4px}
.empty p{margin:0 auto 14px;max-width:420px;font-size:14px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--gd);margin-left:8px;vertical-align:middle}
.ph{font-size:22px;font-weight:700;color:var(--tx2)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.stats small{color:var(--tx2);display:block}
/* FORMS, TABLES AND CONTROLS: styles inputs, tables, toggles and chat bubbles used by the calculator, watchlist, settings and assistant. */
label{display:block;font-size:13px;color:var(--tx2);margin-bottom:4px}
.f{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 12px}
.f:focus{outline:0;border-color:var(--g)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--bd)}th{color:var(--tx2);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tw{overflow-x:auto}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:10px;padding:3px;margin-bottom:16px;background:var(--card)}
.seg button{border:0;background:none;padding:6px 14px;border-radius:7px;color:var(--tx2)}
.seg button.on{background:var(--g);color:#fff}
.res{font-size:28px;font-weight:700;color:var(--gd)}
.neg{color:var(--red)}
.msgs{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.m{max-width:80%;padding:10px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--card)}
.m.u{align-self:flex-end;background:var(--g);color:#fff;border-color:var(--g)}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd)}
.tg:last-child{border:0}
.sw{width:42px;height:24px;border-radius:99px;background:var(--bd);border:0;position:relative;padding:0}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--g)}.sw.on:after{left:21px}
#bar{display:none}
#scrim{display:none}
/* CHAT: styles the full-height conversation view, message bubbles, markdown content, copy/retry actions and notices. */
#view.chatv{display:flex;flex-direction:column;overflow:hidden;padding-bottom:16px}
.chat{flex:1;display:flex;flex-direction:column;min-height:0;width:100%;max-width:960px;margin:0 auto}
.chat .msgs{flex:1;overflow:auto;min-height:0;padding-bottom:8px}
.chatbox textarea{flex:1;border:0;background:none;outline:0;resize:none;min-width:0;padding:8px 0;max-height:160px;line-height:1.4}
.m.a{max-width:100%;width:fit-content}
.m.err{border-color:var(--red)}
.md p{margin:0 0 8px}.md>:last-child{margin-bottom:0}.md h4{margin:10px 0 6px;font-size:15px}
.md ul,.md ol{margin:0 0 8px;padding-left:20px}.md table{font-size:13px}
.md code{background:var(--bg);padding:1px 5px;border-radius:5px;font-size:13px}.md pre{background:var(--bg);padding:10px;border-radius:8px;overflow:auto}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--tx2);margin-top:8px}
.btn.sm{padding:3px 10px;font-size:12.5px;border-radius:8px}
.load{color:var(--tx2);animation:pl 1.4s ease-in-out infinite}@keyframes pl{50%{opacity:.45}}
.note{font-size:13px;color:var(--tx2);background:var(--soft);border-radius:10px;padding:8px 12px;margin-bottom:10px}
.lnk{background:none;border:0;padding:0;color:var(--gd);text-decoration:underline}
/* MARKET SEARCH: styles the search row, autocomplete list, result table, stock detail panel and coverage notes. */
.mrow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.ac{position:relative;flex:1;min-width:220px}
.sug{position:absolute;left:0;right:0;top:100%;margin:4px 0 0;padding:4px;list-style:none;background:var(--card);border:1px solid var(--bd);border-radius:12px;max-height:340px;overflow:auto;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.sug li{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer;flex-wrap:wrap}
.sug li.on,.sug li[data-id]:hover{background:var(--soft)}.sug li.info{cursor:default;color:var(--tx2);font-size:13px}
.tkr{font-weight:600}.xb{font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--bd);color:var(--tx2);white-space:nowrap}
.xb.g{background:var(--soft);color:var(--gd);border-color:transparent}.xb.w{border-color:var(--red);color:var(--red)}
.sm2{font-size:12.5px;color:var(--tx2)}
.rr{background:none;border:0;text-align:left;padding:0;font-weight:600;color:var(--gd)}.rr:hover{text-decoration:underline}
.pos{color:var(--gd)}
.spark{width:100%;height:140px;stroke:none;margin:8px 0}
.warnb{border:1px solid var(--red);border-radius:10px;padding:8px 12px;font-size:13px;margin-top:10px}
details.cov summary{cursor:pointer;font-weight:600}
/* STOCK ANALYSIS: styles the interactive chart, tooltip, toggles and metric cards of the stock dashboard. */
.chartwrap{position:relative;margin:6px 0}
.chartsvg{width:100%;height:auto;stroke:none;fill:none;display:block;touch-action:pan-y}
.ct{fill:var(--tx2);font-size:10.5px;stroke:none}.gl{stroke:var(--bd);stroke-width:1}.cx{stroke:var(--tx2);stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px 10px;font-size:12px;min-width:150px;box-shadow:0 6px 18px rgba(0,0,0,.14);z-index:5}
.tgl{border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:3px 12px;font-size:12.5px;color:var(--tx2)}
.tgl[aria-pressed=true]{background:var(--soft);color:var(--gd);border-color:var(--g)}
.ctl{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;margin:10px 0}.ctl .seg{margin:0}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;margin-top:14px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--bd);font-size:14px}.kv:last-child{border:0}
.kv>span{color:var(--tx2)}
/* SCREENER: styles the scan panel, progress bar, sortable results table and filter grid. */
.prog{width:100%;height:10px;accent-color:var(--g)}
.sortb{background:none;border:0;font:inherit;color:inherit;padding:0;cursor:pointer;text-transform:inherit;letter-spacing:inherit;white-space:nowrap}
.sortb:hover,th[aria-sort="ascending"] .sortb,th[aria-sort="descending"] .sortb{color:var(--gd)}
.zt th,.zt td{white-space:nowrap}.zt td:first-child{white-space:normal;min-width:190px}
.fchip{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--gd);margin:2px 4px 2px 0}
.pg{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
/* WATCHLIST AND COMPARE: styles the toast, search results, comparison table, correlation matrix and legend. */
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80;max-width:90vw}
#toast.show{opacity:1}
.msr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--bd);padding:8px 4px}
.msr:hover{background:var(--soft)}
.leg{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.legb{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:3px 12px;font-size:12.5px;color:var(--tx)}
.legb[aria-pressed=false]{opacity:.45;text-decoration:line-through}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.ctable th,.ctable td{white-space:normal;text-align:right;vertical-align:top}.ctable th:first-child,.ctable td:first-child{text-align:left;color:var(--tx2);min-width:150px}
.bestc{background:var(--soft);font-weight:600}
.cm td{text-align:center;min-width:64px}
.chip2{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:3px 6px 3px 12px;font-size:13px;margin:0 6px 6px 0}
.chip2 button{border:0;background:none;color:var(--tx2);padding:0 4px;font-size:15px}
/* RESPONSIVE: below 860px the sidebar becomes a slide-in drawer and a bottom tab bar appears for phones and small tablets. */
@media(max-width:860px){
 #sb{position:fixed;z-index:50;top:0;bottom:0;left:0;transform:translateX(-100%);transition:transform .2s;width:280px!important;box-shadow:0 0 30px rgba(0,0,0,.2)}
 body.open #sb{transform:none}
 body.open #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
 body.col .tx,body.col .lbl,body.col #hist,body.col .brand b{display:revert}
 #menu{display:grid}.top{padding:10px 14px}#colbtn{display:none}
 #view{padding:22px 16px 90px}
 #bar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--sb);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:30;justify-content:space-around}
 #bar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--tx2);padding:4px 10px;border-radius:8px}
 #bar button.on{color:var(--gd);font-weight:600}
 .m{max-width:92%}#view.chatv{padding-bottom:84px}
}
</style>
</head>
<body>
<!-- Sidebar markup: brand, collapse button, New Chat, conversation history and navigation (filled in by JavaScript). -->
<aside id="sb" aria-label="Sidebar">
 <div class="brand"><div class="logo"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg></div><b>FinBot</b>
  <button class="ib" id="colbtn" aria-label="Collapse sidebar" data-tip="Expand"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button></div>
 <button class="newchat" id="newchat" data-tip="New Chat"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="tx">New Chat</span></button>
 <div class="lbl">Conversations</div><div id="hist"></div>
 <nav id="nav"></nav>
</aside>
<div id="scrim"></div>
<!-- Main column: a top bar with the page title and theme toggle, above the area where the selected page is drawn. -->
<div id="main">
 <header class="top">
  <button class="ib" id="menu" aria-label="Open menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <h2 id="ttl">Home</h2>
  <button class="ib" id="theme" aria-label="Toggle theme" title="Toggle light/dark"></button>
 </header>
 <main id="view"></main>
</div>
<!-- Mobile bottom tab bar, hidden on desktop. -->
<div id="bar"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
// ICONS: a small library of inline SVG icon paths so the app needs no external icon files.
const I={
compare:'<path d="M7 4v16M17 4v16M3 8l4-4 4 4M13 16l4 4 4-4"/>',
home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',
overview:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
chat:'<path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/>',
market:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',
screen:'<path d="M3 5h18l-7 8v6l-4 2v-8z"/>',
watch:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
exp:'<circle cx="12" cy="12" r="9"/><path d="M12 12V3M12 12l6.4 6.4"/>',
calc:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/>',
set:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
tool:'<path d="M14.7 6.3a4 4 0 005 5L21 17l-4 4-5.7-1.3L6 14.3 3 21l6-3 5.7-11.7z"/>',
send:'<path d="M5 12h14M13 6l6 6-6 6"/>',
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',
moon:'<path d="M21 13A9 9 0 1111 3a7 7 0 0010 10z"/>',
up:'<path d="M12 16V4M6 10l6-6 6 6M4 20h16"/>'};
const ic=n=>`<svg viewBox="0 0 24 24">${I[n]}</svg>`;
// PAGES: the list of sections (id, label, icon) that drives the sidebar, mobile bar and page title.
const PAGES=[['home','Home','home'],['overview','Overview','overview'],['assistant','AI Assistant','chat'],['market','Market Intelligence','market'],['screener','Stock Screener','screen'],['compare','Compare','compare'],['watchlist','Watchlist','watch'],['expenses','Expense Analysis','exp'],['calculator','Financial Calculator','calc'],['settings','Settings','set']];
// HELPERS: a short DOM selector, plus safe browser storage that quietly does nothing if storage is unavailable.
const $=s=>document.querySelector(s), body=document.body;
const store={get(k,d){try{const v=localStorage.getItem('finbot:'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('finbot:'+k,JSON.stringify(v))}catch(e){}}};
// STATE: one object holding the current page, saved conversations, watchlist tickers, theme and calculator mode.
let S={page:'home',convos:store.get('convos',[]),cur:null,watch:store.get('watch',[]),theme:store.get('theme',null),calc:'compound',pending:null};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save=()=>{store.set('convos',S.convos);store.set('watch',S.watch)};
// Example prompts shown as clickable chips on the home and assistant pages.
const EX=['Explain compound interest with an example.','Calculate the EMI on a ₹5 lakh loan.','Compare the historical performance of two stocks.','Analyse my monthly expenses.'];

/* CHROME: functions that redraw the sidebar, history, mobile bar and theme, and switch between pages. */
// Rebuilds the sidebar links, mobile tabs, conversation history and page title to reflect the current state.
function renderNav(){

 $('#ttl').textContent=(PAGES.find(p=>p[0]===S.page)||[])[1];

const fmt=n=>isFinite(n)?n.toLocaleString(undefined,{maximumFractionDigits:2}):'—';
// Calculates compound growth or a loan's monthly payment from the user's own inputs and shows the result.
function calc(){const o=$('#out');if(!o)return;const v=id=>parseFloat(($('#'+id)||{}).value)||0;
 if(S.calc==='compound'){const P=v('a1'),m=v('a2'),r=v('a3')/1200,n=v('a4')*12;let b=P;for(let i=0;i<n;i++)b=b*(1+r)+m;const put=P+m*n;
  o.innerHTML=`<small style="color:var(--tx2)">Projected value</small><div class="res">${fmt(b)}</div><p class="empty-s" style="padding:0">Contributed ${fmt(put)} · Growth ${fmt(b-put)}. Assumes a constant return, compounded monthly.</p>`}
 else{const P=v('a1'),r=v('a3')/1200,n=v('a4')*12;const e=n?(r?P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1):P/n):0;
  o.innerHTML=`<small style="color:var(--tx2)">Monthly payment</small><div class="res">${fmt(e)}</div><p class="empty-s" style="padding:0">Total paid ${fmt(e*n)} · Total interest ${fmt(e*n-P)}.</p>`}}

// FINANCE TOOLS: the only place numbers are calculated, so neither the AI nor the demo engine ever does its own arithmetic.
const TOOLS={
 emi:{description:'Compute a loan EMI (reducing balance, monthly compounding). Convert lakh=100000 and crore=10000000 to rupees first.',
  inputSchema:{type:'object',properties:{principal:{type:'number',description:'Loan amount in rupees'},annual_rate_pct:{type:'number',description:'Interest rate per year in percent'},years:{type:'number'},months:{type:'number'}},required:['principal','annual_rate_pct']},
  run(a){const n=a.months||Math.round((a.years||0)*12);if(!(a.principal>0)||!(n>0)||!(a.annual_rate_pct>=0))throw new Error('principal, rate and tenure (years or months) must be positive');
   const r=a.annual_rate_pct/1200,e=r?a.principal*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1):a.principal/n;
   return{monthly_emi:round(e),months:n,total_payment:round(e*n),total_interest:round(e*n-a.principal),method:'reducing balance, monthly compounding'}}},
 compound:{description:'Project the future value of a lump sum and/or monthly SIP/contribution at a constant annual return. Amounts in rupees.',
  inputSchema:{type:'object',properties:{principal:{type:'number'},monthly_contribution:{type:'number'},annual_rate_pct:{type:'number'},years:{type:'number'}},required:['annual_rate_pct','years']},
  run(a){const n=Math.round((a.years||0)*12),r=(a.annual_rate_pct||0)/1200,P=a.principal||0,m=a.monthly_contribution||0;
   if(!(n>0)||P<0||m<0||(P===0&&m===0))throw new Error('need years>0 and a principal and/or monthly_contribution');
   let b=P;for(let i=0;i<n;i++)b=b*(1+r)+m;const put=P+m*n;
   return{future_value:round(b),total_invested:round(put),growth:round(b-put),assumption:'constant annual return, compounded monthly, contributions at month end'}}},
 expenses:{description:'Summarise expenses by category with totals and percentage shares.',
  inputSchema:{type:'object',properties:{items:{type:'array',items:{type:'object',properties:{category:{type:'string'},amount:{type:'number'}},required:['category','amount']}}},required:['items']},
  run(a){const it=(a.items||[]).filter(i=>i&&i.amount>0);if(!it.length)throw new Error('items needs [{category, amount}] with positive amounts');
   const by={};it.forEach(i=>{const k=String(i.category||'Other').trim();by[k]=(by[k]||0)+Number(i.amount)});
   const total=Object.values(by).reduce((x,y)=>x+y,0);
   const rows=Object.entries(by).sort((x,y)=>y[1]-x[1]).map(([category,amount])=>({category,amount:round(amount),share_pct:round(amount/total*100)}));
   return{total:round(total),by_category:rows,largest:rows[0].category}}},
 market_data:{description:'Fetch historical prices or market facts for a stock symbol. Call this BEFORE stating any price, return or market figure.',
  inputSchema:{type:'object',properties:{symbol:{type:'string'},period:{type:'string'}},required:['symbol']},
  run(){throw new Error('Market data is only available when the chat provider is Your Python backend (python app.py). Do not state prices, returns or other market figures.')}}
};
const SYS="You are FinBot, a finance assistant for users in India. Use ₹ and Indian grouping; understand lakh (1,00,000), crore (1,00,00,000), EMI, SIP, PPF, EPF, NPS, FD/RD, ELSS, GST, CIBIL, Nifty/Sensex, SEBI, RBI, demat. Rules: (1) Use the tools for every calculation (emi, compound, expenses); never do arithmetic yourself. (2) For any stock price, return or market fact, call market_data first; if it errors, say the data is unavailable and explain concepts only. Never invent numbers or market facts. (3) If inputs are missing, ask, or state clearly labelled assumptions. (4) Separate Facts, Calculations (tool results), Assumptions and Estimates; explain uncertainty; never guarantee returns; this is educational, not personal advice. (5) Be concise; use markdown and tables when comparing.";

// SCREENER INTENT: recognises stock-screening questions so they are answered from the stored scan rather than guessed.
const isScreenIntent=q=>/strongest|weakest|best[- ]performing|worst[- ]performing|top[- ]performing|top (\d+ )?(gainers|losers)|highly volatile|high volatility|low volatility|(above|below|over|under) (their |its |the )?(20|50|200)[- ]?(day|dma|sma|moving)|positive (?:[\w-]+ ){0,2}returns|negative (?:[\w-]+ ){0,2}returns|\b(banking|bank|pharma|steel|cement|insurance) stocks\b|\bscreen(er)?\b/i.test(q);
// COMPARE INTENT: recognises 'compare A and B [over a period]' and returns the names and range (null when no stocks are named).
function parseCompare(q){const m=String(q).replace(/[.?!]+$/,'').match(/\bcompare\s+(.+)/i);if(!m)return null;let body=m[1],range='1y';
 for(const [re,r] of [[/\b(?:over|for|during|in)?\s*(?:the\s+)?(?:last|past)?\s*(?:1|one)[ -]?month\b/i,'1mo'],[/\b(?:over|for|during|in)?\s*(?:the\s+)?(?:last|past)?\s*(?:3|three)[ -]?months?\b/i,'3mo'],[/\b(?:over|for|during|in)?\s*(?:the\s+)?(?:last|past)?\s*(?:6|six)[ -]?months?\b/i,'6mo'],[/\b(?:over|for|during|in)?\s*(?:the\s+)?(?:last|past)?\s*(?:(?:1|one)[ -]?year|12 months|year)\b/i,'1y'],[/\b(?:over|for|during|in)?\s*(?:the\s+)?(?:last|past)?\s*(?:5|five)[ -]?years?\b/i,'5y'],[/\b(?:over|for|during|in)?\s*(?:the\s+)?(?:max(?:imum)?|all time)\b/i,'max']])if(re.test(body)){range=r;body=body.replace(re,' ');break}
 body=body.replace(/\s+(over|for|during|in|since)\s*$/i,'').replace(/\s+/g,' ').trim();
 const names=body.split(/\s*(?:,|\band\b|\bvs\.?\b|\bversus\b|\bwith\b|&)\s*/i).map(x=>x.trim()).filter(Boolean);
 if(names.length<2||names.length>6||names.some(n=>/\b(two|three|some|several|stocks|shares|banking|historical|performance)\b/i.test(n)))return null;return{names,range}}
// PARSING: reads rupee amounts written as 5 lakh, ₹2.5 crore, 50k or 5,00,000 from free text.
const num=(t,re)=>{const m=t.match(re);return m?parseFloat(m[1]):null};
function findAmount(t){const s=t.toLowerCase().replace(/,/g,'');
 let m=s.match(/(?:₹|rs\.?\s*|inr\s*)?(\d+(?:\.\d+)?)\s*(crores?|cr|lakhs?|lacs?|lac|k)\b/);
 if(m)return parseFloat(m[1])*(/^cr/.test(m[2])?1e7:/^la/.test(m[2])?1e5:1e3);
 m=s.match(/(?:₹|rs\.?\s*|inr\s*)(\d+(?:\.\d+)?)/);if(m)return parseFloat(m[1]);
 const big=(s.match(/\d+(?:\.\d+)?/g)||[]).map(Number).filter(n=>n>=1000);return big.length?Math.max(...big):null}

// DEMO ENGINE: an explicitly labelled fallback that recognises a few request types and answers using only the finance tools above, with no AI model.
function demo(q){
 const t=q.toLowerCase(),used=[];const run=(n,a)=>{used.push(n);return TOOLS[n].run(a)};
 if(t.trim()==='/fail')throw E('demo_failure','Simulated failure (demo-mode test command).');
 if(/\bemi\b|loan|repay|mortgage/.test(t)){
  const P=findAmount(q);if(!P)return{used,text:'Tell me the loan amount, for example: **EMI on ₹5 lakh at 10% for 5 years**.'};
  let r=num(q,/(\d+(?:\.\d+)?)\s*(?:%|percent)/),n=num(q,/(\d+)\s*(?:months?|mos?)\b/)||(num(q,/(\d+(?:\.\d+)?)\s*(?:years?|yrs?|y)\b/)||0)*12;const as=[];
  if(r==null){r=10;as.push('an interest rate of **10% p.a.**')}if(!n){n=60;as.push('a tenure of **5 years**')}
  const x=run('emi',{principal:P,annual_rate_pct:r,months:Math.round(n)});
  return{used,text:`### EMI estimate\n| Item | Value |\n|---|---|\n| Loan amount | ${inr(P)} |\n| Interest rate | ${r}% p.a. |\n| Tenure | ${Math.round(n)} months |\n| **Monthly EMI** | **${inr(x.monthly_emi)}** |\n| Total interest | ${inr(x.total_interest)} |\n| Total payment | ${inr(x.total_payment)} |\n\n**Calculation:** from the app's EMI function (${x.method}).\n${as.length?`**Assumptions:** I assumed ${as.join(' and ')} because you did not give them. Send your real numbers for an accurate figure.\n`:''}**Note:** lenders may add processing fees and GST, so your actual schedule can differ.`}}
 if(/expense|spend|spending|budget/.test(t)){
  const items=[];q.split('\n').forEach(l=>{const m=l.match(/^\s*[-*•]?\s*([A-Za-z][A-Za-z &\/]*?)\s*[:\-–=]?\s*(?:₹|rs\.?\s*)?(\d[\d,]*(?:\.\d+)?)\s*(k|lakhs?)?\s*$/i);if(m)items.push({category:m[1].trim(),amount:parseFloat(m[2].replace(/,/g,''))*(m[3]?(/^k/i.test(m[3])?1e3:1e5):1)})});
  if(items.length<2)return{used,text:'Paste your monthly expenses, **one per line**, and I will total and rank them:\n\n```\nRent 15000\nFood 8000\nTransport 2500\nSubscriptions 999\n```\nA common rule of thumb (not a rule) is 50% needs, 30% wants, 20% savings; your own goals matter more.'};
  const x=run('expenses',{items});
  return{used,text:`### Expense breakdown\n| Category | Amount | Share |\n|---|---|---|\n${x.by_category.map(r=>`| ${r.category} | ${inr(r.amount)} | ${r.share_pct}% |`).join('\n')}\n| **Total** | **${inr(x.total)}** | 100% |\n\n**Calculation:** totals and shares come from the app's expense function. Your largest category is **${x.largest}**.\n**Note:** I only analyse the figures you pasted; I cannot tell whether they are complete.`}}
 if(/compound|\bsip\b|interest|fixed deposit|\bfd\b|recurring/.test(t)){
  const amt=findAmount(q),mc=q.toLowerCase().replace(/,/g,'').match(/(\d+(?:\.\d+)?)\s*(k|lakhs?)?\s*(?:per month|\/\s*month|monthly|a month)/);
  const contrib=mc?parseFloat(mc[1])*(mc[2]?(mc[2]==='k'?1e3:1e5):1):0;let P=amt&&amt!==contrib?amt:0;const as=[];
  if(!P&&!contrib){P=100000;as.push('a starting amount of **₹1,00,000**')}
  let r=num(q,/(\d+(?:\.\d+)?)\s*(?:%|percent)/),y=num(q,/(\d+(?:\.\d+)?)\s*(?:years?|yrs?|y)\b/);
  if(r==null){r=8;as.push('a return of **8% p.a.**')}if(y==null){y=10;as.push('**10 years**')}
  const x=run('compound',{principal:P,monthly_contribution:contrib,annual_rate_pct:r,years:y});
  return{used,text:`### Compound interest\nYour money earns returns, and later those returns earn returns too, so growth speeds up over time.\n\n| Item | Value |\n|---|---|\n| Starting amount | ${inr(P)} |\n| Monthly contribution | ${inr(contrib)} |\n| Return and duration | ${r}% p.a. for ${y} years |\n| Total invested | ${inr(x.total_invested)} |\n| **Projected value** | **${inr(x.future_value)}** |\n| Growth | ${inr(x.growth)} |\n\n**Calculation:** from the app's compound function (${x.assumption}).\n${as.length?`**Assumptions:** ${as.join(', ')}.\n`:''}**Uncertainty:** real investments fluctuate and returns are never guaranteed; this is an illustration, not a forecast.`}}
 if(/stock|share|nifty|sensex|return|compare|price|portfolio|mutual fund|performance/.test(t)){
  let why='';try{run('market_data',{symbol:'?'})}catch(e){why=e.message}
  return{used,text:`### Market data isn't available\n${why}\n\nSo I won't quote prices, returns or comparisons; any numbers would be made up.\n\n**To compare real stocks:** name them, for example *Compare Reliance and TCS over 1 year*, or use the Compare page.\n\n**What I can explain now:** to compare two stocks over time, look at **CAGR** (smoothed yearly return), **volatility** (how much returns swing), **maximum drawdown** (worst peak-to-trough fall) and dividends, over the *same* dates, and remember past performance does not predict future returns.`}}
 return{used,text:'**Demo mode** only understands four things: EMI/loan questions, compound interest/SIP, expense analysis, and (explaining that) market data is not connected. Choose a live provider in **Settings** for open-ended questions.'}}

// MARKDOWN: a small safe renderer (headings, lists, bold, italics, code, tables) that escapes HTML first so replies cannot inject markup.
function md(s){
 const e=x=>x.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
 const inl=x=>e(x).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<i>$2</i>');
 const L=String(s).replace(/\r/g,'').split('\n'),sep=/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/,li=/^\s*[-*]\s+/,ol=/^\s*\d+[.)]\s+/;
 const row=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());let o='',i=0;
 while(i<L.length){const l=L[i];let m;
  if(l.trim().startsWith('```')){let b=[];i++;while(i<L.length&&!L[i].trim().startsWith('```')){b.push(L[i]);i++}i++;o+=`<pre><code>${e(b.join('\n'))}</code></pre>`;continue}
  if(l.includes('|')&&i+1<L.length&&sep.test(L[i+1])){const hd=row(l);i+=2;let b='';while(i<L.length&&L[i].includes('|')&&L[i].trim()){b+='<tr>'+row(L[i]).map(c=>`<td>${inl(c)}</td>`).join('')+'</tr>';i++}
   o+=`<div class="tw"><table><thead><tr>${hd.map(c=>`<th>${inl(c)}</th>`).join('')}</tr></thead><tbody>${b}</tbody></table></div>`;continue}
  if(m=l.match(/^#{1,4}\s+(.*)/)){o+=`<h4>${inl(m[1])}</h4>`;i++;continue}
  if(li.test(l)){let b='';while(i<L.length&&li.test(L[i])){b+=`<li>${inl(L[i].replace(li,''))}</li>`;i++}o+=`<ul>${b}</ul>`;continue}
  if(ol.test(l)){let b='';while(i<L.length&&ol.test(L[i])){b+=`<li>${inl(L[i].replace(ol,''))}</li>`;i++}o+=`<ol>${b}</ol>`;continue}
  if(!l.trim()){i++;continue}
  const p=[];while(i<L.length&&L[i].trim()&&!/^(#{1,4}\s|```)/.test(L[i].trim())&&!li.test(L[i])&&!ol.test(L[i])&&!(L[i].includes('|')&&i+1<L.length&&sep.test(L[i+1]))){p.push(inl(L[i]));i++}
  o+=`<p>${p.join('<br>')}</p>`}
 return o}

// CONVERSATION CONTEXT: turns saved messages into the alternating user/assistant list sent to the model, skipping failed replies so follow-ups keep their context.
function hist(c){const out=[];for(const m of c.msgs){if(m.err)continue;const role=m.r==='u'?'user':'assistant';
 if(out.length&&out[out.length-1].role===role)out[out.length-1].content+='\n\n'+m.t;else out.push({role,content:m.t})}
 const h=out.slice(-16);while(h.length&&h[0].role!=='user')h.shift();return h}

// PROVIDERS: three interchangeable ways to get an answer (platform AI, your Python backend, or the labelled demo engine).
async function askPlatform(h,onText,signal,used){
 const tools=Object.entries(TOOLS).map(([name,t])=>({name,description:t.description,inputSchema:t.inputSchema,execute:async a=>{used.push(name);return t.run(a||{})}}));
 const msgs=h.map((m,i)=>i?m:{role:m.role,content:SYS+'\n\n---\nUser message:\n'+m.content});
 const r=await S.sample(msgs,{tools,onText:({text})=>onText(text),signal,cache:false});

async function askBackend(h,signal,used){
 let r;try{r=await fetch(S.backendUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:h}),signal})}
 catch(e){if(e.name==='AbortError')throw e;throw E('network','Could not reach the backend at '+S.backendUrl+'. Start it with python app.py, or fix the URL in Settings.')}
 let d={};try{d=await r.json()}catch(e){}
 if(!r.ok)throw E('http',d.error||('The backend returned HTTP '+r.status+'.'));
 (d.tools_used||[]).forEach(x=>used.push(x));return d.text}

 const p=prov(),h=hist(c);
 if(p==='platform'){if(!S.sample)throw E('unavailable','The platform AI is not available here (for example when the page is self-hosted). Pick the backend or demo provider in Settings.');
  return{src:'Live AI',text:await askPlatform(h,t=>{S.partial=t;const el=$('#pend .md');if(el){el.classList.remove('load');el.innerHTML=md(t);scrollEnd()}},S.ctl.signal,used)}}
 if(p==='backend')return{src:'Backend AI',text:await askBackend(h,S.ctl.signal,used)};
 if(isScreenIntent(h[h.length-1].content)){const q=h[h.length-1].content;try{const d=await mget('screener/nl',{q,page_size:10},S.ctl.signal);used.push('screener');return{src:'Demo mode · stored scan',text:screenReply(d)}}catch(e){if(e&&e.name==='AbortError')throw e;return{src:'Demo mode (no AI model)',text:'**Screening needs the Python backend and a completed scan.** '+mktErr(e||{})}}}

  const d=await mget('compare',{ids:ms.map(x=>x.id).join(','),range:pc.range,fundamentals:0},S.ctl.signal);used.push('compare');return{src:'Demo mode · retrieved data',text:compareReply(d,ms,pc.names)}}catch(e){if(e&&e.name==='AbortError')throw e;return{src:'Demo mode (no AI model)',text:'**Comparison needs the Python backend.** '+mktErr(e||{})}}}
 await sleep(300);if(S.ctl.signal.aborted)throw E('aborted','stopped');
 const r=demo(h[h.length-1].content);used.push(...r.used);return{src:'Demo mode (no AI model)',text:r.text}}

// ERRORS: converts technical failures into short messages that say what happened and what to do next.
function errMsg(e){const c=e&&e.code;
 if(S.ctl&&S.ctl.signal.aborted||c==='aborted'||(e&&e.name==='AbortError'))return 'The response was stopped. Press Retry to ask again.';
 if(c==='not_granted')return 'Permission to use the AI was not granted. Allow it when prompted, then retry.';
 if(c==='rate_limited')return 'Too many requests right now. Wait a moment, then retry.';
 return (e&&e.message)||'Unexpected error. Please retry.'}

// CHAT FLOW: send() records the user message and run() gets the reply, saving either the answer or a retryable error.
async function send(text){

 let c=cur();if(!c){c={id:Date.now(),title:text.slice(0,40),msgs:[]};S.convos.unshift(c);S.cur=c.id}
 c.msgs.push({r:'u',t:text});save();
 if(S.page!=='assistant')go('assistant');else refresh();
 await run(c)}

 S.busy=c.id;S.partial='';S.ctl=new AbortController();refresh();const used=[];let msg;
 try{const a=await answer(c,used);msg={r:'a',t:a.text||'The assistant returned an empty response.',src:a.src,tools:[...new Set(used)]};if(!a.text)msg.err=1}
 catch(e){msg={r:'a',err:1,t:errMsg(e)}}
 c.msgs.push(msg);S.busy=null;S.ctl=null;S.partial='';save();refresh()}

// CHAT REPLY: formats a plain-English screening result (from the backend) as a markdown answer with its coverage statement.
function screenReply(d){const r=d.result,rows=r.rows||[];
 const head=(d.understood&&d.understood.length?'**How I read your question:** '+d.understood.join('; ')+'.\n\n':'')+(d.notes&&d.notes.length?d.notes.map(n=>'*'+n+'*').join('\n')+'\n\n':'');
 if(!r.scan.exchanges.length)return head+'**No exchange has been scanned yet.** Open **Stock Screener** and press Scan for an exchange first; I only report results from an actual scan.';
 const c=v=>v==null?'—':fmtN(v)+'%',nm=x=>String(x).replace(/\|/g,'/');
 const t=rows.length?'| Company | Ticker | Exch. | Price | Day | 1M | 6M | 1Y | Volatility |\n|---|---|---|---|---|---|---|---|---|\n'+rows.map(x=>`| ${nm(x.name)} | ${nm(x.symbol)} | ${x.exchange} | ${px(x.price,x.currency)} | ${c(x.chg)} | ${c(x.perf_1m)} | ${c(x.perf_6m)} | ${c(x.perf_1y)} | ${c(x.vol)} |`).join('\n'):'**No stocks matched these filters.**';
 return head+`**${r.total.toLocaleString('en-IN')} matches**`+(r.filters_applied.length?' ('+r.filters_applied.join('; ')+')':'')+`, showing ${rows.length}, sorted by ${r.sort} (${r.dir}).\n\n`+t+`\n\n**Coverage:** ${r.scan.statement}\n\n*End-of-day data from the last scan, not live; percentages are price returns. Open the Stock Screener page to filter further, sort and export.*`}

// WATCHLIST MODEL: lists of instruments saved in this browser only (no account), with validation, limits, export and import.
const WLKEY='wl2',WL_LISTS=20,WL_ITEMS=50,TOASTS={last:''};
const clip=(v,n)=>String(v==null?'':v).slice(0,n);
const genId=()=>'l'+Date.now().toString(36)+Math.floor(Math.random()*1e5).toString(36);
function wlItem(i){if(!i||typeof i!=='object')return null;const id=clip(i.id,70);if(!/^[^:]{1,60}:\S{1,30}$/.test(id))return null;
 return{id,name:clip(i.name||id,120),symbol:clip(i.symbol||id.split(':')[1],30),exchange:clip(i.exchange||id.split(':')[0],60),currency:i.currency?clip(i.currency,8):null,added:clip(i.added,32)}}
const wlDefault=()=>({v:2,active:'default',lists:[{id:'default',name:'My watchlist',items:[]}]});
function wlSanitize(d){if(!d||typeof d!=='object'||!Array.isArray(d.lists))return wlDefault();const seen=new Set(),lists=[];
 for(const l of d.lists.slice(0,WL_LISTS)){if(!l||typeof l!=='object')continue;let id=clip(l.id,40)||genId();while(seen.has(id))id=genId();seen.add(id);const ids=new Set(),items=[];
  for(const it of Array.isArray(l.items)?l.items:[]){const c=wlItem(it);if(c&&!ids.has(c.id)&&items.length<WL_ITEMS){ids.add(c.id);items.push(c)}}lists.push({id,name:clip(l.name,40)||'My watchlist',items})}
 if(!lists.length)return wlDefault();return{v:2,active:lists.some(l=>l.id===d.active)?d.active:lists[0].id,lists}}
let WL=wlSanitize(store.get(WLKEY,null));
const wlSave=()=>store.set(WLKEY,WL);
const wlList=id=>WL.lists.find(l=>l.id===(id||WL.active))||WL.lists[0];
function wlAdd(item,listId){const l=wlList(listId),it=wlItem(Object.assign({},item,{added:new Date().toISOString().slice(0,10)}));if(!it)return'invalid';if(l.items.some(x=>x.id===it.id))return'exists';if(l.items.length>=WL_ITEMS)return'full';l.items.push(it);wlSave();return'added'}
function wlRemove(id,listId){const l=wlList(listId);l.items=l.items.filter(x=>x.id!==id);wlSave()}
function wlNewList(name){name=clip(name,40).trim();if(!name||WL.lists.length>=WL_LISTS)return null;const l={id:genId(),name,items:[]};WL.lists.push(l);WL.active=l.id;wlSave();return l.id}
function wlRename(id,name){name=clip(name,40).trim();const l=wlList(id);if(name&&l){l.name=name;wlSave()}}
function wlDelete(id){if(WL.lists.length<2)return false;WL.lists=WL.lists.filter(l=>l.id!==id);if(WL.active===id)WL.active=WL.lists[0].id;wlSave();return true}
const wlExport=()=>JSON.stringify({app:'FinBot',v:2,exported:new Date().toISOString(),lists:WL.lists},null,1);
function wlImport(text){let d;try{d=JSON.parse(text)}catch(e){throw new Error('That file is not valid JSON.')}
 if(!d||d.app!=='FinBot'||!Array.isArray(d.lists))throw new Error('That file is not a FinBot watchlist export.');
 const clean=wlSanitize({lists:d.lists});let la=0,ia=0,sk=0;
 for(const l of clean.lists){let t=WL.lists.find(x=>x.name===l.name);if(!t){if(WL.lists.length>=WL_LISTS){sk+=l.items.length;continue}t={id:genId(),name:l.name,items:[]};WL.lists.push(t);la++}
  for(const it of l.items){if(t.items.some(x=>x.id===it.id))continue;if(t.items.length>=WL_ITEMS){sk++;continue}t.items.push(it);ia++}}
 wlSave();return{lists_added:la,items_added:ia,skipped:sk}}
// COMPARISON SELECTION: up to 6 instruments plus the chosen range, remembered in this browser.
const CMP_MAX=6,CMPKEY='compare';
const cmpSaved=(()=>{const d=store.get(CMPKEY,null);return d&&Array.isArray(d.ids)?d:{}})();

// COMPARE CHART MATHS: series colours, one multi-line SVG on a shared date axis, hover rows, correlation colouring and reply formatting.
const CMP_COLORS=['#10B981','#3B82F6','#F59E0B','#8B5CF6','#EC4899','#14B8A6'];
function cmpChartSvg(S,view,hidden,W,ids){const dates=S.dates,n=dates.length;if(n<2)return null;
 const data=view==='drawdown'?S.drawdown:S.perf,keys=ids.filter(k=>!hidden[k]&&data[k]);const vals=[].concat(...keys.map(k=>data[k])).filter(nz);if(!vals.length)return null;
 const L=58,R=10,T=8,H=300,AX=20,pw=W-L-R,x=i=>L+pw*i/(n-1);let mn=Math.min(...vals,0),mx=Math.max(...vals,0);if(mn===mx){mn-=1;mx+=1}const pad=(mx-mn)*.06;if(mx>0)mx+=pad;if(mn<0)mn-=pad;
 const y=v=>T+(H-T-AX)-(v-mn)/(mx-mn)*(H-T-AX);let o='';
 niceTicks(mn,mx,5).forEach(t=>{const yy=y(t);o+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}"/><text class="ct" x="${L-6}" y="${(yy+3.5).toFixed(1)}" text-anchor="end">${fmtN(t,mx-mn<10?1:0)}%</text>`});
 o+=`<line style="stroke:var(--tx2);stroke-width:1" x1="${L}" x2="${W-R}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}"/>`;
 keys.forEach(k=>{o+=`<path data-k="${esc(k)}" d="${pathOf(data[k],x,y)}" style="fill:none;stroke:${CMP_COLORS[ids.indexOf(k)%6]};stroke-width:2"/>`});
 [...new Set([0,1,2,3,4].map(k=>Math.round(k*(n-1)/4)))].forEach((i,k,a)=>{o+=`<text class="ct" x="${x(i).toFixed(1)}" y="${H-4}" text-anchor="${k===0?'start':k===a.length-1?'end':'middle'}">${dates[i].slice(0,n>260?7:10).slice(n>260?0:5)}</text>`});
 return{svg:`<svg class="chartsvg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Comparison chart from ${dates[0]} to ${dates[n-1]}">${o}<line id="cmx" class="cx" x1="0" x2="0" y1="${T}" y2="${H-AX}" style="visibility:hidden"/><rect id="cmv" x="${L}" y="0" width="${pw}" height="${H}" style="fill:transparent"/></svg>`,H,x,n,L,pw}}
function cmpTipRows(S,i,view,hidden,ids,info){const data=view==='drawdown'?S.drawdown:S.perf;return[['Date',S.dates[i]]].concat(ids.filter(k=>!hidden[k]&&data[k]).map(k=>[(info[k]&&info[k].symbol)||k,nz(data[k][i])?(view==='drawdown'?'':(data[k][i]>0?'+':''))+fmtN(data[k][i])+'%':'—']))}
const corrBg=v=>!nz(v)?'transparent':v>=0?`rgba(16,185,129,${(Math.abs(v)*.55).toFixed(2)})`:`rgba(220,38,38,${(Math.abs(v)*.55).toFixed(2)})`;
function compareReply(d,matches,names){const f=v=>v==null?'—':fmtN(v)+'%',ins=d.instruments;
 const m=matches.map((x,i)=>`${names[i]} → **${x.name}** (${x.id})`).join('; ');
 const t='| Instrument | Currency | Return | Volatility (ann.) | Max drawdown |\n|---|---|---|---|---|\n'+ins.map(o=>`| ${String(o.name).replace(/\|/g,'/')} (${o.id}) | ${o.currency||'—'} | ${f(o.return_pct)} | ${f(o.vol_ann_pct)} | ${o.max_drawdown?f(o.max_drawdown.pct):'—'} |`).join('\n');
 const cm=d.correlation,pairs=[];for(let i=0;i<ins.length;i++)for(let j=i+1;j<ins.length;j++)pairs.push(`${ins[i].symbol}/${ins[j].symbol}: ${cm.matrix[i][j]==null?'not enough overlapping data':fmtN(cm.matrix[i][j])}`);
 return`**I matched:** ${m}. Check these are the companies you meant.\n\n**Common window:** ${d.window.start} to ${d.window.end} (${d.range}). Returns are percentage price changes from the same start date in each stock's own currency.\n\n${t}\n\n**Correlation of returns:** ${pairs.join('; ')}.\n\n`+(d.warnings.length?'**Notes:**\n'+d.warnings.map(w=>'- '+w).join('\n')+'\n\n':'')+'*End-of-day data, not live. Open the Compare page for the interactive chart and fundamentals.*'}

 const nums=k=>ins.map(o=>o[k]),mdd=ins.map(o=>o.max_drawdown?o.max_drawdown.pct:null),na='<span class="sm2">Not available</span>',f=ins.map(o=>o.fundamentals);
 const bo=(v,b)=>({v,b:b});const ret=nums('return_pct'),vol=nums('vol_ann_pct');
 return`<table class="ctable"><thead><tr><th></th>${ins.map((o,i)=>`<th><span class="dot" style="background:${CMP_COLORS[i%6]}"></span> <button class="rr" data-cmpopen="${esc(o.id)}">${esc(o.name)}</button><div class="sm2">${esc(o.symbol)} · ${esc(o.exchange)} · ${esc(o.currency||'—')}</div></th>`).join('')}</tr></thead><tbody>
 ${r('Return over window',ins.map(o=>zpct(o.return_pct)),bo(ret,cmpBest(ret,Math.max)))}
 ${r('Volatility (annualised)',ins.map(o=>o.vol_ann_pct==null?`<span class="sm2" title="${esc(o.vol_reason||'')}">—</span>`:fmtN(o.vol_ann_pct)+'%'),bo(vol,cmpBest(vol,Math.min)))}

 ${[20,50,200].map(n=>r(`Price vs ${n}-day average`,ins.map(o=>{const s=o['sma'+n];return s.value==null?`<span class="sm2">${esc(s.reason)}</span>`:`${zpct(s.price_vs_pct)}<div class="sm2">avg ${px(s.value,o.currency)}</div>`}))).join('')}

 ${r('EPS (TTM, own currency)',f.map((x,i)=>x&&x.metrics&&x.metrics.eps_ttm?px(x.metrics.eps_ttm.value,x.metrics.eps_ttm.currency||ins[i].currency):na))}

 </tbody></table>`}

function drawCmpChart(){const el=$('#cmpchart'),d=CMP.res;if(!el||!d)return;const ids=d.instruments.map(o=>o.id),W=Math.max(300,Math.floor(el.clientWidth||720)),g=cmpChartSvg(d.series,CMP.view,CMP.hidden,W,ids);

 const ov=$('#cmv'),cx=$('#cmx'),tip=$('#cmptip');if(!ov||!cx||!tip)return;const info={};d.instruments.forEach(o=>info[o.id]=o);
 const move=e=>{const r=ov.getBoundingClientRect(),i=idxAt(e.clientX,r.left,r.width,g.n),X=g.x(i);cx.setAttribute('x1',X);cx.setAttribute('x2',X);cx.style.visibility='visible';
  tip.innerHTML=cmpTipRows(d.series,i,CMP.view,CMP.hidden,ids,info).map(([k,v])=>`<div class="kv" style="padding:2px 0;border:0"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('');tip.hidden=false;const w=tip.offsetWidth||160;tip.style.left=Math.max(0,Math.min(X+14,g.W-w-4))+'px';tip.style.top='6px'};
 ov.onpointermove=move;ov.onpointerdown=move;ov.onpointerleave=()=>{cx.style.visibility='hidden';tip.hidden=true}}
async function runCompare(){const req=++CMP.req;if(CMP.ids.length<2){CMP.res=null;CMP.err=null;CMP.busy=false;drawCmpRes();return}
 CMP.busy=true;CMP.err=null;drawCmpRes();
 try{const d=await mget('compare',{ids:CMP.ids.join(','),range:CMP.range});if(req!==CMP.req)return;CMP.res=d;d.instruments.forEach(o=>{CMP.info[o.id]=Object.assign({},CMP.info[o.id],{id:o.id,name:o.name,symbol:o.symbol,exchange:o.exchange,currency:o.currency})});cmpSave()}
 catch(e){if(req!==CMP.req||e.name==='AbortError')return;CMP.res=null;CMP.err=e}
 CMP.busy=false;drawCmpSel();drawCmpRes()}
function cmpCsv(){const d=CMP.res;if(!d)return'';const ids=d.instruments.map(o=>o.id),q=v=>'"'+String(v).replace(/"/g,'""')+'"';
 return[['Date'].concat(d.instruments.map(o=>o.symbol+' ('+o.id+') return % since '+d.window.start)).map(q).join(',')].concat(d.series.dates.map((dt,i)=>[dt].concat(ids.map(k=>{const v=d.series.perf[k][i];return v==null?'':v})).join(','))).join('\n')}
function bindCompare(){drawCmpSel();drawMS('cmp');drawCmpRes();if(CMP.ids.length>=2&&!CMP.res&&!CMP.busy)runCompare()}
const downloadText=(name,text,type)=>{const a=document.createElement('a');a.href='data:'+type+';charset=utf-8,'+encodeURIComponent(text);a.download=name;a.click()};
// ACTIONS: every Watchlist/Compare control routes through these functions.
function wlAskName(msg,def){return typeof prompt==='function'?prompt(msg,def):null}
function onWlClick(d,t){
 if(d.wladd!==undefined){const it=INFO[d.wladd];if(it){const r=wlAdd(it);toast(r==='added'?`${it.symbol} added to your watchlist.`:WSTATUS[r])}}
 else if(d.cmpadd!==undefined){const it=INFO[d.cmpadd];if(it){const r=cmpAdd(it);toast(r==='added'?`${it.symbol} added to the comparison (${CMP.ids.length}/${CMP_MAX}).`:CSTATUS[r]);if(S.page==='watchlist'&&(r==='added'||r==='exists'))go('compare')}}
 else if(d.cmpgo!==undefined){const it=INFO[d.cmpgo];if(it){const r=cmpAdd(it);if(r==='full')toast(CSTATUS.full);else go('compare')}}
 else if(d.msadd!==undefined){const [k,id]=d.msadd.split('|');msAdd(k,id)}
 else if(d.wlrm!==undefined){wlRemove(d.wlrm);WLSEL.delete(d.wlrm);toast('Removed from your watchlist.');drawWatch()}
 else if(d.wlsel!==undefined){t.checked?WLSEL.add(d.wlsel):WLSEL.delete(d.wlsel);drawWatch()}
 else if(d.wlopen!==undefined)openStockPage(d.wlopen)
 else if(d.wllist!==undefined){WL.active=d.wllist;wlSave();WLSEL.clear();drawWatch();loadQuotes()}
 else if(d.wlnew!==undefined){const id=wlNewList(wlAskName('Name for the new list:',''));if(id){WLSEL.clear();drawWatch()}else toast(WL.lists.length>=WL_LISTS?'You have reached the limit of 20 lists.':'A list needs a name.')}
 else if(d.wlrename!==undefined){const n=wlAskName('Rename this list:',wlList().name);if(n){wlRename(WL.active,n);drawWatch()}}
 else if(d.wldel!==undefined){if(WL.lists.length>1&&(typeof confirm!=='function'||confirm('Delete the list "'+wlList().name+'" and its stocks?'))){wlDelete(WL.active);WLSEL.clear();drawWatch();loadQuotes()}}
 else if(d.wlrefresh!==undefined){WQ.data={};WQ.errors={};loadQuotes()}
 else if(d.wlcmp!==undefined){WLSEL.forEach(id=>{const it=INFO[id];if(it)cmpAdd(it)});go('compare')}
 else if(d.wlcmpall!==undefined){wlList().items.slice(0,CMP_MAX).forEach(it=>cmpAdd(it));go('compare')}
 else if(d.wlexport!==undefined){downloadText('finbot-watchlists.json',wlExport(),'application/json');toast('Watchlists exported.')}
 else if(d.wlimport!==undefined){const f=$('#wlfile');if(f&&f.click)f.click()}
 else if(d.wllegacy!==undefined){S.watch=[];save();drawWatch()}
 else if(d.cmprm!==undefined){cmpRemove(d.cmprm);drawCmpSel();runCompare()}
 else if(d.cmprange!==undefined){CMP.range=d.cmprange;cmpSave();drawCmpSel();runCompare()}
 else if(d.cmpview!==undefined){CMP.view=d.cmpview;drawCmpRes()}
 else if(d.cmpleg!==undefined){CMP.hidden[d.cmpleg]=!CMP.hidden[d.cmpleg];drawCmpRes()}
 else if(d.cmpclear!==undefined){CMP.ids=[];CMP.info={};CMP.hidden={};CMP.res=null;CMP.err=null;cmpSave();drawCmpSel();drawCmpRes()}
 else if(d.cmpfromwl!==undefined){let n=0;wlList().items.forEach(it=>{if(cmpAdd(it)==='added')n++});toast(n?`Added ${n} from your watchlist.`:'Nothing new to add from your watchlist.');drawCmpSel();runCompare()}
 else if(d.cmpopen!==undefined)openStockPage(d.cmpopen)
 else if(d.cmpcsv!==undefined){downloadText('finbot-comparison.csv',cmpCsv(),'text/csv')}
 else if(d.zcmp!==undefined){const rows=(Z.res&&Z.res.rows||[]).slice(0,CMP_MAX);rows.forEach(r=>{const it=reg(r);if(it)cmpAdd(INFO[it])});go('compare')}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-wladd],[data-cmpadd],[data-cmpgo],[data-msadd],[data-wlrm],[data-wlopen],[data-wllist],[data-wlnew],[data-wlrename],[data-wldel],[data-wlrefresh],[data-wlcmp],[data-wlcmpall],[data-wlexport],[data-wlimport],[data-wllegacy],[data-cmprm],[data-cmprange],[data-cmpview],[data-cmpleg],[data-cmpclear],[data-cmpfromwl],[data-cmpopen],[data-cmpcsv],[data-zcmp]');if(t)onWlClick(t.dataset,t)});
document.addEventListener('change',e=>{const t=e.target,d=t&&t.dataset;if(!d)return;if(d.wlsel!==undefined)onWlClick(d,t);else if(t.id==='wlfile'&&t.files&&t.files[0]){t.files[0].text().then(x=>{try{const r=wlImport(x);toast(`Imported ${r.items_added} stock(s) into ${r.lists_added} new list(s)`+(r.skipped?`; ${r.skipped} skipped (limits).`:'.'));drawWatch();loadQuotes()}catch(err){toast(err.message)}})}});
document.addEventListener('input',e=>{const t=e.target,k=t&&t.dataset&&t.dataset.ms;if(!k)return;MS[k].q=t.value;clearTimeout(MS[k].t);MS[k].t=setTimeout(()=>msSearch(k),250)});
document.addEventListener('keydown',e=>{const t=e.target,k=t&&t.dataset&&t.dataset.ms;if(k&&e.key==='Enter'){e.preventDefault();msSearch(k)}});
if(window.addEventListener)window.addEventListener('resize',()=>{clearTimeout(CMP.rt);CMP.rt=setTimeout(()=>{if(S.page==='compare')drawCmpChart()},150)});
// PLATFORM AI CHECK: asks the hosting page whether live AI is available and updates the labels when it answers.
(async()=>{try{if(window.claude&&claude.use){const s=await claude.use('sample');if(s)S.sample=s}}catch(e){}
 try{const c=await(await fetch(S.backendUrl.replace(/\/chat$/,'')+'/config')).json();S.backendReady=!!c.chat;S.llmName=c.model||''}catch(e){}
 const b=$('#provbadge');if(b)b.textContent=provLabel();const st=$('#provstat');if(st)st.textContent=provStat()})();

// START: apply the theme and open the home screen.
applyTheme();go('home');
</script>
